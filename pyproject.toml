[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ihatepdf"
version = "0.1.0"
description = "A lightweight local PDF and image CLI utility. Because PDFs are annoying."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "iHatePDF Authors" }
]
keywords = ["pdf", "image", "compress", "split", "cli", "utility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=5.0.0",
    "Pillow>=10.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ihatepdf = "ihatepdf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ihatepdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
